<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Involved | Volunteer or Donate</title>
    <meta
      name="description"
      content="Support Masakaneng Soup Kitchen. Volunteer your time, donate funds, or sponsor our daily feeding programs."
    />
    <meta
      name="keywords"
      content="volunteer Seshego, donate to charity, sponsor meals, help the homeless, food donations"
    />
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div>
        <img src="images/logo.jpg" alt="Masakaneng Soup Kitchen Logo" />
        <h1>Masakaneng Soup Kitchen</h1>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Get Involved</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <section>
      <h1>Get Involved</h1>
      <p>Volunteer, donate, or sponsor - every bit helps.</p>
    </section>

    <!-- Enquiry Form -->
    <section>
      <form id="enquiryForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="interest">I want to...</label>
        <select id="interest" name="interest" required>
          <option value="volunteer">Volunteer</option>
          <option value="donate-food">Donate Food</option>
          <option value="donate-funds">Donate Funds</option>
          <option value="sponsor">Sponsor</option>
        </select>

        <button type="submit">Send</button>
      </form>

      <!-- This is where the JavaScript message will appear -->
      <div id="enquiryResult" class="form-result"></div>
    </section>
    <footer>
      <p>&copy; 2026 Masakaneng Soup Kitchen. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
